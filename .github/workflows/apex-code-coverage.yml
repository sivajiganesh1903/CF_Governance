name: Run Apex Code Coverage on Commit

on:
    push:
        branches:
            - 'feature/Dev1/**'
    workflow_dispatch:

env:
    COVERAGE_THRESHOLD: 85
    TEST_MAPPING_FILE: .github/apex-test-mapping.yml
    TARGET_ORG_ALIAS: TRNDEV1

jobs:
    run-apex-code-coverage:
        # Run the job on the latest version of Ubuntu
        runs-on: ubuntu-latest
        # Set the environment for the job
        environment: TRNDEV1

        steps:
            # Checkout the repository to access the source code
            - name: Checkout Source Code
              uses: actions/checkout@v7.0.1
              with:
                fetch-depth: 0      # fetch the complete Git history of the repository Including all commits, branches and tags

            # Install Preequisite tools
            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '>=20.9.0'

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '>=3.10'

            - name: Install Python Dependencies
              run: pip install pyyaml

            - name: Get Changed Files
              id: changed_files
              shell: bash
              run: |
                echo "Fetching main branch..."
                git fetch origin main:refs/remotes/origin/main
                echo "Getting files changed in the feature branch..."
                git diff \
                  --name-only \
                  --diff-filter=ACMR \
                  origin/main...${{ github.sha }} \
                  > changed_files.txt

                echo "***** Changed Files *****"
                if [ -s changed_files.txt ]; then
                  cat changed_files.txt
                  echo "has_files=true" >> "$GITHUB_OUTPUT"
                else
                  echo "No changed files found."
                  echo "has_files=false" >> "$GITHUB_OUTPUT"
                fi

            # Keep only Apex classes / triggers; test classes themselves are not measured for coverage
            - name: Detect Changed Apex Components
              id: changed_apex
              if: steps.changed_files.outputs.has_files == 'true'
              shell: bash
              run: |
                : > changed_apex.txt
                while IFS= read -r file; do
                  case "$file" in
                    *.cls|*.trigger) ;;
                    *) continue ;;
                  esac
                  if grep -qi '@istest' "$file"; then
                    echo "Skipping test class: $file"
                    continue
                  fi
                  echo "$file" >> changed_apex.txt
                done < changed_files.txt

                echo "***** Changed Apex Components *****"
                if [ -s changed_apex.txt ]; then
                  cat changed_apex.txt
                  echo "has_apex=true" >> "$GITHUB_OUTPUT"
                else
                  echo "No Apex classes or triggers changed. Skipping code coverage check."
                  echo "has_apex=false" >> "$GITHUB_OUTPUT"
                  echo "### Apex Code Coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo "No Apex classes or triggers changed — coverage check skipped." >> "$GITHUB_STEP_SUMMARY"
                fi

            # Look up the test classes for every changed component; fail if any mapping is missing
            - name: Resolve Mapped Test Classes
              id: resolve_tests
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: python
              run: |
                import os, sys, yaml

                mapping_file = os.environ["TEST_MAPPING_FILE"]
                if not os.path.isfile(mapping_file):
                    print(f"::error file={mapping_file}::Test mapping file '{mapping_file}' not found. "
                          "Create it with an 'apexTestMapping' section listing test classes for each Apex component.")
                    sys.exit(1)

                with open(mapping_file) as f:
                    data = yaml.safe_load(f) or {}
                raw_mapping = data.get("apexTestMapping") or {}
                # Apex names are case-insensitive
                mapping = {name.lower(): (cfg or {}).get("testClasses") or [] for name, cfg in raw_mapping.items()}

                with open("changed_apex.txt") as f:
                    files = [line.strip() for line in f if line.strip()]

                components, tests, missing = [], [], []
                for path in files:
                    name = os.path.splitext(os.path.basename(path))[0]
                    components.append(name)
                    mapped = mapping.get(name.lower())
                    if not mapped:
                        missing.append((name, path))
                        continue
                    print(f"{name} -> {', '.join(mapped)}")
                    for t in mapped:
                        if t not in tests:
                            tests.append(t)

                if missing:
                    for name, path in missing:
                        print(f"::error file={path}::No test class mapping found for '{name}'. "
                              f"Add an entry to {mapping_file}:  {name}: {{ testClasses: [<{name}Test>] }}")
                    print()
                    print(f"Add the following to {mapping_file} (replace with the real test class names):")
                    print()
                    for name, _ in missing:
                        print(f"  {name}:\n    testClasses:\n      - {name}Test\n")
                    sys.exit(1)

                with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                    out.write(f"components={','.join(components)}\n")
                    out.write(f"test_classes={','.join(tests)}\n")
                print(f"\nTest classes to run: {', '.join(tests)}")

            # Install Salesforce CLI
            - name: Install Salesforce CLI
              if: steps.changed_apex.outputs.has_apex == 'true'
              run: |
                echo "Installing Salesforce CLI..."
                npm install --global @salesforce/cli@latest

            - name: Verify Salesforce CLI Installation
              if: steps.changed_apex.outputs.has_apex == 'true'
              run: sf --version
            
            - name: Authenticate to Salesforce (TRNDEV1)
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: bash
              env:
                SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
              run: |
                echo "$SF_JWT_KEY" > authfile.txt
                sf org login jwt \
                    --client-id ${{ secrets.TRNDEV1_CONSUMER_KEY }} \
                    --jwt-key-file authfile.txt \
                    --username ${{ secrets.TRNDEV1_USERNAME }} \
                    --instance-url ${{ vars.SF_LOGIN_URL }} \
                    --alias "$TARGET_ORG_ALIAS" \
                    --set-default
                rm -f authfile.txt


            # Validate-only deploy of the branch's changes: Salesforce compiles the branch code,
            # runs the mapped tests against it, reports coverage, then rolls everything back.
            - name: Validate Deploy and Run Mapped Apex Tests
              id: run_tests
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: bash
              run: |
                mkdir -p test-results
                SOURCE_ARGS=()
                TEST_ARGS=()

                # Every changed file under force-app (Apex may depend on changed fields/objects)
                while IFS= read -r file; do
                  case "$file" in
                    force-app/*) [ -f "$file" ] && SOURCE_ARGS+=(--source-dir "$file") ;;
                  esac
                done < changed_files.txt

                # Mapped test classes, so the branch version of each test is used
                IFS=',' read -ra TESTS <<< "${{ steps.resolve_tests.outputs.test_classes }}"
                for t in "${TESTS[@]}"; do
                  TEST_ARGS+=(--tests "$t")
                  test_file=$(find force-app -name "$t.cls" -print -quit)
                  if [ -n "$test_file" ]; then
                    SOURCE_ARGS+=(--source-dir "$test_file")
                  else
                    echo "::warning::Test class $t not found in repository; using the version in $TARGET_ORG_ALIAS."
                  fi
                done

                echo "Running: sf project deploy start --dry-run --test-level RunSpecifiedTests ${TEST_ARGS[*]} ${SOURCE_ARGS[*]}"
                set +e
                sf project deploy start \
                  --dry-run \
                  --test-level RunSpecifiedTests \
                  "${TEST_ARGS[@]}" \
                  "${SOURCE_ARGS[@]}" \
                  --wait 60 \
                  --json \
                  --target-org "$TARGET_ORG_ALIAS" \
                  > test-results/deploy-result.json
                EXIT_CODE=$?
                set -e

                echo "sf project deploy start exit code: $EXIT_CODE"
                echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

            # Evaluate coverage of each changed component against the threshold
            - name: Check Code Coverage
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: python
              env:
                COMPONENTS: ${{ steps.resolve_tests.outputs.components }}
                TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code }}
              run: |
                import json, os, sys

                def as_list(value):
                    # Metadata API returns a single object instead of a one-element list
                    if value is None:
                        return []
                    return value if isinstance(value, list) else [value]

                threshold = float(os.environ["COVERAGE_THRESHOLD"])
                components = [c for c in os.environ["COMPONENTS"].split(",") if c]

                try:
                    with open("test-results/deploy-result.json") as f:
                        run = json.load(f)
                except (OSError, json.JSONDecodeError) as e:
                    print(f"::error::Could not read deploy results: {e}")
                    sys.exit(1)

                result = run.get("result") or {}
                details = result.get("details") or {}
                if not details:
                    print(f"::error::Validation deploy failed: {run.get('message', 'no result returned')}")
                    sys.exit(1)

                failed = False

                # Compile / deploy errors mean no tests ran
                component_failures = as_list(details.get("componentFailures"))
                for c in component_failures:
                    print(f"::error file={c.get('fileName', '')}::{c.get('componentType')} {c.get('fullName')} "
                          f"(line {c.get('lineNumber')}): {c.get('problem')}")
                    failed = True

                if component_failures:
                    with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                        s.write(f"### Apex Code Coverage (threshold {threshold:.0f}%)\n\n")
                        s.write("**Validation deploy failed — no tests were run. Fix these errors first:**\n\n")
                        for c in component_failures:
                            s.write(f"- `{c.get('componentType')} {c.get('fullName')}` line "
                                    f"{c.get('lineNumber')}: {c.get('problem')}\n")
                    print(f"\nValidation deploy failed with {len(component_failures)} error(s); "
                          "tests were not run, so coverage was not measured.")
                    sys.exit(1)

                test_result = details.get("runTestResult") or {}
                failed_tests = as_list(test_result.get("failures"))
                coverage = {c["name"].lower(): c for c in as_list(test_result.get("codeCoverage"))}

                rows, below = [], []
                for name in components:
                    cov = coverage.get(name.lower())
                    if cov is None:
                        pct, covered, total = 0.0, 0, 0
                        note = "not covered by mapped tests"
                    else:
                        total = int(cov.get("numLocations", 0))
                        covered = total - int(cov.get("numLocationsNotCovered", 0))
                        pct = 100.0 if total == 0 else covered * 100.0 / total
                        note = ""
                    ok = pct >= threshold
                    if not ok:
                        below.append(name)
                    rows.append((name, pct, covered, total, ok, note))

                tests_run = test_result.get("numTestsRun", 0)
                num_failures = test_result.get("numFailures", 0)

                print("========================================")
                print(" Apex Code Coverage (threshold %.0f%%)" % threshold)
                print("========================================")
                for name, pct, covered, total, ok, note in rows:
                    status = "PASS" if ok else "FAIL"
                    print(f"{status}  {name:<45} {pct:6.2f}%  ({covered}/{total} lines) {note}")
                print()
                print(f"Tests run: {tests_run}, failing: {num_failures}")

                with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                    s.write(f"### Apex Code Coverage (threshold {threshold:.0f}%)\n\n")
                    s.write("| Component | Coverage | Lines | Status |\n|---|---|---|---|\n")
                    for name, pct, covered, total, ok, note in rows:
                        s.write(f"| {name} | {pct:.2f}% | {covered}/{total} | {'✅' if ok else '❌'} {note} |\n")
                    s.write(f"\n**Tests:** {tests_run} run, {num_failures} failed\n")
                    if failed_tests:
                        s.write("\n**Failed tests:**\n\n")
                        for t in failed_tests:
                            s.write(f"- `{t.get('name')}.{t.get('methodName')}`: {t.get('message')}\n")

                for t in failed_tests:
                    print(f"::error::Test failed: {t.get('name')}.{t.get('methodName')} - {t.get('message')}")
                    failed = True
                if not failed and os.environ.get("TEST_EXIT_CODE") not in ("0", ""):
                    print(f"::error::Validation deploy failed (exit code {os.environ['TEST_EXIT_CODE']}): "
                          f"{run.get('message', '')}")
                    failed = True
                for name in below:
                    print(f"::error::{name} is below the required {threshold:.0f}% code coverage.")
                    failed = True

                if failed:
                    sys.exit(1)
                print(f"All changed Apex components meet {threshold:.0f}% coverage.")

            - name: Upload Test Results
              if: always() && steps.changed_apex.outputs.has_apex == 'true'
              uses: actions/upload-artifact@v4
              with:
                name: apex-test-results
                path: test-results/
                if-no-files-found: ignore

            - name: Logout from Salesforce
              if: always() && steps.changed_apex.outputs.has_apex == 'true'
              run: sf org logout --target-org "$TARGET_ORG_ALIAS" --no-prompt || true

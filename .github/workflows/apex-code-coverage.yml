name: Run Apex Code Coverage on Commit

on:
    push:
        branches:
            - 'feature/Dev1/**'
    workflow_dispatch:

env:
    COVERAGE_THRESHOLD: 85
    TEST_MAPPING_FILE: .github/apex-test-mapping.yml
    TARGET_ORG_ALIAS: TRNDEV1

jobs:
    run-apex-code-coverage:
        # Run the job on the latest version of Ubuntu
        runs-on: ubuntu-latest
        # Set the environment for the job
        environment: TRNDEV1

        steps:
            # Checkout the repository to access the source code
            - name: Checkout Source Code
              uses: actions/checkout@v7.0.1
              with:
                fetch-depth: 0      # fetch the complete Git history of the repository Including all commits, branches and tags

            # Install Preequisite tools
            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '>=20.9.0'

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '>=3.10'

            - name: Install Python Dependencies
              run: pip install pyyaml

            - name: Get Changed Files
              id: changed_files
              shell: bash
              run: |
                echo "Fetching main branch..."
                git fetch origin main:refs/remotes/origin/main
                echo "Getting files changed in the feature branch..."
                git diff \
                  --name-only \
                  --diff-filter=ACMR \
                  origin/main...${{ github.sha }} \
                  > changed_files.txt

                echo "***** Changed Files *****"
                if [ -s changed_files.txt ]; then
                  cat changed_files.txt
                  echo "has_files=true" >> "$GITHUB_OUTPUT"
                else
                  echo "No changed files found."
                  echo "has_files=false" >> "$GITHUB_OUTPUT"
                fi

            # Split changed Apex into components to measure (classes / triggers) and test classes changed on the branch
            - name: Detect Changed Apex Components
              id: changed_apex
              if: steps.changed_files.outputs.has_files == 'true'
              shell: bash
              run: |
                : > changed_apex.txt
                : > changed_tests.txt
                
                # Loop through each changed file and categorize it as an Apex component or a test class
                while IFS= read -r file; do
                  case "$file" in
                    *.cls|*.trigger) ;;
                    *) continue ;;
                  esac
                  # Check if the file is a test class by looking for the @isTest annotation
                  if grep -qi '@istest' "$file"; then
                    basename "$file" .cls >> changed_tests.txt
                    continue
                  fi
                  echo "$file" >> changed_apex.txt
                done < changed_files.txt
                
                # If there are changed test classes, print them and set the branch_tests output variable
                echo "***** Changed Test Classes *****"
                if [ -s changed_tests.txt ]; then
                  cat changed_tests.txt
                  # Set the branch_tests output variable to a comma-separated list of changed test classes
                  echo "branch_tests=$(paste -sd, changed_tests.txt)" >> "$GITHUB_OUTPUT"
                else
                  echo "None"
                fi

                # If there are changed Apex components, print them and set the has_apex output variable
                echo "***** Changed Apex Components *****"
                if [ -s changed_apex.txt ]; then
                  cat changed_apex.txt
                  echo "has_apex=true" >> "$GITHUB_OUTPUT"
                else
                  echo "No Apex classes or triggers changed. Skipping code coverage check."
                  echo "has_apex=false" >> "$GITHUB_OUTPUT"
                  echo "### Apex Code Coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo "No Apex classes or triggers changed — coverage check skipped." >> "$GITHUB_STEP_SUMMARY"
                fi

            # Install Salesforce CLI
            - name: Install Salesforce CLI
              if: steps.changed_apex.outputs.has_apex == 'true'
              run: |
                echo "Installing Salesforce CLI..."
                npm install --global @salesforce/cli@latest

            - name: Verify Salesforce CLI Installation
              if: steps.changed_apex.outputs.has_apex == 'true'
              run: sf --version

            - name: Authenticate to Salesforce (TRNDEV1)
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: bash
              env:
                SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
              run: |
                echo "$SF_JWT_KEY" > authfile.txt
                sf org login jwt \
                    --client-id ${{ secrets.TRNDEV1_CONSUMER_KEY }} \
                    --jwt-key-file authfile.txt \
                    --username ${{ secrets.TRNDEV1_USERNAME }} \
                    --instance-url ${{ vars.SF_LOGIN_URL }} \
                    --alias "$TARGET_ORG_ALIAS" \
                    --set-default
                rm -f authfile.txt

            # Step 1: run the test classes changed on this branch to see which changed components they cover
            - name: Run Branch Test Classes
              id: run_branch_tests
              if: steps.changed_apex.outputs.has_apex == 'true' && steps.changed_apex.outputs.branch_tests != ''
              shell: bash
              run: |
                # Create a directory to store the test results for the branch tests
                mkdir -p test-results/branch
                # Build the command-line arguments for the test classes to run
                CLASS_ARGS=()
                # Split the branch_tests output variable into an array of test class names
                IFS=',' read -ra TESTS <<< "${{ steps.changed_apex.outputs.branch_tests }}"
                for t in "${TESTS[@]}"; do
                  CLASS_ARGS+=(--class-names "$t")
                done
                
                # Print the command that will be run for debugging purposes
                echo "Running: sf apex run test ${CLASS_ARGS[*]} --code-coverage"
                set +e
                sf apex run test \
                  "${CLASS_ARGS[@]}" \
                  --code-coverage \
                  --json \
                  --output-dir test-results/branch \
                  --wait 60 \
                  --target-org "$TARGET_ORG_ALIAS" \
                  > test-results/branch/run-result.json
                EXIT_CODE=$?
                set -e
                
                # Print the exit code of the Salesforce CLI command and set it as an output variable for later steps
                echo "sf apex run test exit code: $EXIT_CODE"
                echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

            # Step 2: for components the branch tests do not cover, fall back to the test mapping file.
            # Step 3: if a component is in neither, fail as not covered.
            - name: Resolve Test Classes
              id: resolve_tests
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: python
              env:
                BRANCH_TESTS: ${{ steps.changed_apex.outputs.branch_tests }}
              run: |
                import json, os, sys, yaml

                threshold = float(os.environ["COVERAGE_THRESHOLD"])
                mapping_file = os.environ["TEST_MAPPING_FILE"]
                branch_tests = [t for t in os.environ.get("BRANCH_TESTS", "").split(",") if t]

                # Coverage achieved by the branch test classes (empty if none were changed)
                branch_coverage = {}
                if branch_tests:
                    try:
                        with open("test-results/branch/run-result.json") as f:
                            run = json.load(f)
                    except (OSError, json.JSONDecodeError) as e:
                        print(f"::error::Could not read branch Apex test results: {e}")
                        sys.exit(1)
                    result = run.get("result") or {}
                    if not result.get("summary"):
                        # e.g. INVALID_INPUT when a test class is missing or has no test methods in the org
                        print(f"::error::Branch Apex test run failed: {run.get('message', 'no result returned')}")
                        sys.exit(1)
                    for c in (result.get("coverage") or {}).get("coverage", []):
                        covered, total = int(c.get("totalCovered", 0)), int(c.get("totalLines", 0))
                        branch_coverage[c["name"].lower()] = 100.0 if total == 0 else covered * 100.0 / total

                # Apex names are case-insensitive
                mapping = {}
                if os.path.isfile(mapping_file):
                    with open(mapping_file) as f:
                        data = yaml.safe_load(f) or {}
                    mapping = {name.lower(): (cfg or {}).get("testClasses") or []
                               for name, cfg in (data.get("apexTestMapping") or {}).items()}

                with open("changed_apex.txt") as f:
                    files = [line.strip() for line in f if line.strip()]

                components, tests, not_covered = [], list(branch_tests), []
                for path in files:
                    name = os.path.splitext(os.path.basename(path))[0]
                    components.append(name)
                    pct = branch_coverage.get(name.lower(), 0.0)
                    if pct >= threshold:
                        print(f"{name}: {pct:.2f}% covered by branch test classes")
                        continue
                    mapped = mapping.get(name.lower())
                    if mapped:
                        print(f"{name}: {pct:.2f}% from branch test classes, adding mapped tests -> {', '.join(mapped)}")
                        for t in mapped:
                            if t not in tests:
                                tests.append(t)
                    elif pct > 0:
                        # Partially covered with no mapping; the coverage check will report the shortfall
                        print(f"{name}: {pct:.2f}% covered by branch test classes, no mapping in {mapping_file}")
                    else:
                        not_covered.append((name, path))

                if not_covered:
                    for name, path in not_covered:
                        print(f"::error file={path}::Apex class '{name}' is not covered, so provide the test class "
                              f"for the code coverage. Commit a test class that covers it on this branch, "
                              f"or add it to {mapping_file}.")
                    with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                        s.write("### Apex Code Coverage\n\n")
                        for name, _ in not_covered:
                            s.write(f"- ❌ `{name}` is not covered, so provide the test class for the code coverage\n")
                    sys.exit(1)

                extra = [t for t in tests if t not in branch_tests]
                with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                    out.write(f"components={','.join(components)}\n")
                    out.write(f"test_classes={','.join(tests)}\n")
                    out.write(f"needs_run={'true' if extra else 'false'}\n")
                print(f"\nTest classes: {', '.join(tests)}")

            # Re-run with branch + mapped test classes when the mapping added any; otherwise reuse the branch run
            - name: Run Apex Tests
              id: run_tests
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: bash
              run: |
                mkdir -p test-results
                if [ "${{ steps.resolve_tests.outputs.needs_run }}" != "true" ]; then
                  echo "Branch test classes cover all changed components; reusing their results."
                  cp test-results/branch/run-result.json test-results/run-result.json
                  echo "exit_code=${{ steps.run_branch_tests.outputs.exit_code }}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                CLASS_ARGS=()
                IFS=',' read -ra TESTS <<< "${{ steps.resolve_tests.outputs.test_classes }}"
                for t in "${TESTS[@]}"; do
                  CLASS_ARGS+=(--class-names "$t")
                done

                echo "Running: sf apex run test ${CLASS_ARGS[*]} --code-coverage"
                set +e
                sf apex run test \
                  "${CLASS_ARGS[@]}" \
                  --code-coverage \
                  --json \
                  --output-dir test-results \
                  --wait 60 \
                  --target-org "$TARGET_ORG_ALIAS" \
                  > test-results/run-result.json
                EXIT_CODE=$?
                set -e

                echo "sf apex run test exit code: $EXIT_CODE"
                echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

            # Evaluate coverage of each changed component against the threshold
            - name: Check Code Coverage
              if: steps.changed_apex.outputs.has_apex == 'true'
              shell: python
              env:
                COMPONENTS: ${{ steps.resolve_tests.outputs.components }}
                TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code }}
              run: |
                import json, os, sys

                threshold = float(os.environ["COVERAGE_THRESHOLD"])
                components = [c for c in os.environ["COMPONENTS"].split(",") if c]

                try:
                    with open("test-results/run-result.json") as f:
                        run = json.load(f)
                except (OSError, json.JSONDecodeError) as e:
                    print(f"::error::Could not read Apex test results: {e}")
                    sys.exit(1)

                result = run.get("result") or {}
                if not result.get("summary"):
                    # e.g. INVALID_INPUT when a test class is missing or has no test methods in the org
                    print(f"::error::Apex test run failed: {run.get('message', 'no result returned')}")
                    sys.exit(1)

                summary = result["summary"]
                failed_tests = [t for t in result.get("tests", []) if t.get("Outcome") != "Pass"]
                coverage = {c["name"].lower(): c for c in (result.get("coverage") or {}).get("coverage", [])}

                rows, below = [], []
                for name in components:
                    cov = coverage.get(name.lower())
                    if cov is None:
                        pct, covered, total = 0.0, 0, 0
                        note = "not covered by test classes (or not in org)"
                    else:
                        covered, total = int(cov.get("totalCovered", 0)), int(cov.get("totalLines", 0))
                        pct = 100.0 if total == 0 else covered * 100.0 / total
                        note = ""
                    ok = pct >= threshold
                    if not ok:
                        below.append(name)
                    rows.append((name, pct, covered, total, ok, note))

                print("========================================")
                print(" Apex Code Coverage (threshold %.0f%%)" % threshold)
                print("========================================")
                for name, pct, covered, total, ok, note in rows:
                    status = "PASS" if ok else "FAIL"
                    print(f"{status}  {name:<45} {pct:6.2f}%  ({covered}/{total} lines) {note}")
                print()
                print(f"Tests run: {summary.get('testsRan')}, passing: {summary.get('passing')}, "
                      f"failing: {summary.get('failing')}, outcome: {summary.get('outcome')}")

                with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                    s.write(f"### Apex Code Coverage (threshold {threshold:.0f}%)\n\n")
                    s.write("| Component | Coverage | Lines | Status |\n|---|---|---|---|\n")
                    for name, pct, covered, total, ok, note in rows:
                        s.write(f"| {name} | {pct:.2f}% | {covered}/{total} | {'✅' if ok else '❌'} {note} |\n")
                    s.write(f"\n**Tests:** {summary.get('testsRan')} run, {summary.get('passing')} passed, "
                            f"{summary.get('failing')} failed\n")
                    if failed_tests:
                        s.write("\n**Failed tests:**\n\n")
                        for t in failed_tests:
                            s.write(f"- `{t.get('FullName')}`: {t.get('Message')}\n")

                failed = False
                for t in failed_tests:
                    print(f"::error::Test failed: {t.get('FullName')} - {t.get('Message')}")
                    failed = True
                if not failed and os.environ.get("TEST_EXIT_CODE") not in ("0", ""):
                    print(f"::error::sf apex run test exited with code {os.environ['TEST_EXIT_CODE']}: "
                          f"{run.get('message', '')}")
                    failed = True
                for name in below:
                    print(f"::error::{name} is below the required {threshold:.0f}% code coverage.")
                    failed = True

                if failed:
                    sys.exit(1)
                print(f"All changed Apex components meet {threshold:.0f}% coverage.")

            - name: Upload Test Results
              if: always() && steps.changed_apex.outputs.has_apex == 'true'
              uses: actions/upload-artifact@v4
              with:
                name: apex-test-results
                path: test-results/
                if-no-files-found: ignore

            - name: Logout from Salesforce
              if: always() && steps.changed_apex.outputs.has_apex == 'true'
              run: sf org logout --target-org "$TARGET_ORG_ALIAS" --no-prompt || true

<template>
    <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
            <span class="slds-assistive-text">Close</span>
        </button>
    </header>
    
    <template if:true={templatePage}>
        <div class="slds-align_absolute-center">
            <header class="slds-truncate utils"><br/>
                <h1 class="slds-section__title utilTitle1">
                    <p style="color:#3670b6"><strong><font size="8">Release Templates</font></strong></p>
                </h1>
            </header>
        </div>
        <br/>
        <div class="slds-modal__content slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:true={templates}>
                <lightning-datatable
                    data-id="datatable"
                    key-field="id"
                    data={recordsToDisplay}
                    columns={columns}
                    max-visible-items="10"
                    onrowselection={handleRowSelection}
                    max-row-selection="1">
                </lightning-datatable><br/><br/>

                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                    <div class="slds-align_absolute-center">
                        <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                        <div class="slds-select_container">
                            <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                <template for:each={pageSizeOptions} for:item="option">
                                    <option key={option} value={option}>{option}</option>
                                </template>
                            </select>
                        </div>&nbsp;&nbsp;&nbsp;
                        <lightning-button label="First" icon-name="utility:chevronleft" icon-position="left" onclick={firstHandler} disabled={isFirstDisable}></lightning-button> &nbsp;&nbsp;
                        <lightning-button label="Previous" icon-name="utility:chevronleft" icon-position="left" onclick={previousHandler} disabled={isPreviousDisable}></lightning-button> &nbsp;&nbsp;
                        <span class="slds-badge slds-badge_lightest" style="margin-right: 10px;margin-left: 10px;">Showing {page} &nbsp;of&nbsp; {totalPage} &nbsp;&nbsp;Page(s)</span> &nbsp;&nbsp;
                        <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler} disabled={isNextDisable}></lightning-button> &nbsp;&nbsp;
                        <lightning-button label="Last" icon-name="utility:chevronright" icon-position="right" onclick={lastHandler} disabled={isLastDisable}></lightning-button>&nbsp;&nbsp;&nbsp;
                        <div class="slds-clearfix">
                            <div class="slds-float_right">
                                <span class="slds-badge"> Total Records: {totalRecountCount}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        <footer class="slds-modal__footer">
            <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>&nbsp;&nbsp;&nbsp;
            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
        </footer>
    </template>
</template>

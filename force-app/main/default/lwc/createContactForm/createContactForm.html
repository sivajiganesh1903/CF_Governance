<template>
    <lightning-card title="Create Contact Record">
        <lightning-record-edit-form
            object-api-name="Contact"
            onsuccess={handleSuccess}
            oncancel={handleCancel}>

            <lightning-messages></lightning-messages>

            <!-- Lookup: AccountId -->
            <lightning-input-field field-name="AccountId" value={recordId}></lightning-input-field>

            <!-- Lookup/User: OwnerId -->
            <lightning-input-field field-name="OwnerId"></lightning-input-field>

            <!-- Basic Fields -->
            <lightning-input-field field-name="FirstName"></lightning-input-field>
            <lightning-input-field field-name="LastName"></lightning-input-field>
            <lightning-input-field field-name="ContactSource"></lightning-input-field>
            <lightning-input-field field-name="Department"></lightning-input-field>
            <lightning-input-field field-name="Description"></lightning-input-field>
            <lightning-input-field field-name="Email"></lightning-input-field>

            <!-- Submit & Cancel Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button type="submit" label="Save" variant="brand"></lightning-button>
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-left_small"></lightning-button>
            </div>

        </lightning-record-edit-form>
    </lightning-card>
</template>

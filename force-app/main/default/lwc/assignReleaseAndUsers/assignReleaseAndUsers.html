<template>
    <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
            <span class="slds-assistive-text">Close</span>
        </button>
    </header>
    
    <!-- Release Page Starts -->
    <template if:true={releasePage}>
        <div class="slds-align_absolute-center">
            <header class="slds-truncate utils"><br/>
                <h1 class="slds-section__title">
                    <p style="color:#3670b6; text-align:center"><strong><font size="8">Releases</font></strong></p>
                </h1>
                <br/>
                <!-- Release Page Search Bar -->
               <div class="right-aligned-container">
                    <lightning-input 
                        type="text" 
                        onchange={handleKeyChangeRelease} 
                        value={searchKeyRelease}
                        variant="label-hidden"
                        placeholder="Search Here....."
                        style="width: 300px;">
                    </lightning-input>&nbsp;&nbsp;
                </div> 
            </header>
        </div>
        <br/>
        <div class="slds-modal__content slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:true={releases}>
                <lightning-datatable
                    key-field="Id"
                    data={recordsToDisplay}
                    columns={columns}
                    onrowselection={handleRowSelection}
                ></lightning-datatable><br/><br/>
                
                <!-- Pagination Buttons Start -->
                <div class="slds-align_absolute-center">
                    <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                    <div class="slds-select_container">
                        <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                            <template for:each={pageSizeOptions} for:item="option">
                                <option key={option} value={option}>{option}</option>
                            </template>
                        </select>
                    </div>&nbsp;&nbsp;&nbsp;
                    <lightning-button label="First" icon-name="utility:chevronleft" icon-position="left" onclick={firstHandler} disabled={isPreviousDisable}></lightning-button> &nbsp;&nbsp;
                    <lightning-button label="Previous" icon-name="utility:chevronleft" icon-position="left" onclick={previousHandler} disabled={isPreviousDisable}></lightning-button>
                    &nbsp;&nbsp;
                    <span class="slds-badge slds-badge_lightest" style="margin-right: 10px;margin-left: 10px;">
                        Showing {page} &nbsp;of&nbsp; {totalPage} &nbsp;&nbsp;Page(s)
                    </span>&nbsp;&nbsp;
                    <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler} disabled={isNextDisable}></lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button label="Last" icon-name="utility:chevronright" icon-position="right" onclick={lastHandler} disabled={isNextDisable}></lightning-button>&nbsp;&nbsp;&nbsp;
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecountCount}</span>
                        </div>
                    </div>
                </div><br/>
                <!-- Pagination Buttons End -->
            </template>
        </div>
        <footer class="slds-modal__footer">
            <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>&nbsp;&nbsp;&nbsp;
            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>&nbsp;&nbsp;&nbsp;
            <lightning-button icon-name="utility:chevronright" label="Next" onclick={handleNext} disabled={disableNextButton}></lightning-button>
        </footer>
        <!--Alert Start-->
        <template if:true={isAlertVisible}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-align_absolute-center">
                <div class="slds-modal__container modal-top-center">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseAlert}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Alert</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Do you want to assign Users?</p>
                    </div>
                    <footer class="slds-modal__footer">   
                        <lightning-button variant="brand" label="Yes" onclick={handleYes}></lightning-button>&nbsp;&nbsp;&nbsp;
                        <lightning-button variant="neutral" label="No" onclick={handleNo}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!--Alert Ends-->
    </template>
    <!-- Release Page Ends -->

    <!-- User Page Starts -->
    <template if:true={userPage}>
        <div class="slds-align_absolute-center">
            <header class="slds-truncate utils"><br/>
                <h1 class="slds-section__title">
                    <p style="color:#3670b6"><strong><font size="8">All Users</font></strong></p>
                </h1><br/>
                <div class="right-aligned-container">
                    <lightning-input 
                        type="search" 
                        onchange={handleKeyChange} 
                        value={searchKey}
                        variant="label-hidden"
                        placeholder="Search Here....."
                        style="width: 300px;">
                    </lightning-input>&nbsp;&nbsp;
                </div>
            </header>
        </div>
        <br/>
        <div class="slds-modal__content slds-p-around_medium">
            <template if:true={isSpinner}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:true={users}>
                <lightning-datatable
                    data-id="datatable"
                    key-field="Id"
                    data={recordsToDisplay1}
                    columns={userColumns}
                    onrowselection={handleUserRowSelection}
                ></lightning-datatable><br/>

                <!-- Pagination Buttons Start -->
                <div class="slds-align_absolute-center">
                    <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage1">Page Size:</label>
                    <div class="slds-select_container">
                        <select class="slds-select" id="recordsPerPage1" onchange={handleRecordsPerPage1}>
                            <template for:each={pageSizeOptions1} for:item="option1">
                                <option key={option1} value={option1}>{option1}</option>
                            </template>
                        </select>
                    </div>&nbsp;&nbsp;&nbsp;
                    <lightning-button label="First" icon-name="utility:chevronleft" icon-position="left" onclick={firstHandler1} disabled={isPreviousDisable1}></lightning-button> &nbsp;&nbsp;
                    <lightning-button label="Previous" icon-name="utility:chevronleft" icon-position="left" onclick={previousHandler1} disabled={isPreviousDisable1}></lightning-button>
                    &nbsp;&nbsp;
                    <span class="slds-badge slds-badge_lightest" style="margin-right: 10px;margin-left: 10px;">
                        Showing {page1} &nbsp;of&nbsp; {totalPage1} &nbsp;&nbsp;Page(s)
                    </span>&nbsp;&nbsp;
                    <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler1} disabled={isNextDisable1}></lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button label="Last" icon-name="utility:chevronright" icon-position="right" onclick={lastHandler1} disabled={isNextDisable1}></lightning-button>&nbsp;&nbsp;&nbsp;
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <span class="slds-badge"> Total Records: {totalRecountCount1}</span>
                        </div>
                    </div>
                </div><br/>
                <!-- Pagination Buttons End -->
            </template>
        </div>
        <footer class="slds-modal__footer">
            <lightning-button variant="brand" label="Save" onclick={handleUserSave}></lightning-button>&nbsp;&nbsp;&nbsp;
            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>&nbsp;&nbsp;&nbsp;
            <lightning-button icon-name="utility:chevronleft" label="Back" onclick={handleBack}></lightning-button>
        </footer>
    </template>
    <!-- User Page Ends -->
</template>

<!-- sldsValidatorIgnore -->
<template>
    <lightning-card>
        <div class="slds-modal__content">
            <div class="slds-p-around_small">
                <div class="slds-align_absolute-center">
                    <header class="slds-truncate ">
                        <h1 class="slds-section__title "><strong>
                                <p style="color:rgb(6, 4, 6)"> User Access Request List </p>
                            </strong> </h1>
                    </header>
                </div><br />
                <div class="slds-box" style="height: auto;">

                    <template if:true={showSpinnerFlag}>
                        <div class="backgroundInverse" style="min-height:3rem;transform: translate(0, 0);">
                            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <!--DATA TABLE START -->
                    <div style="height:330px;overflow-y:scroll ;">
                        <lightning-datatable key-field="Id" 
                                             data={recordsToDisplay} 
                                             columns={columns}
                                             onrowaction={handleRowAction} 
                                             show-row-number-column 
                                             hide-checkbox-column 
                                             onsort={handleSort}
                                             sorted-by={sortBy}
                                             sorted-direction={sortDirection}>
                        </lightning-datatable>
                    </div><br />
                    <!--DATA TABLE END -->

                    <!-- Pagination Buttons Start -->
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread" style="padding-top: 0.5em;">
                        <div class="slds-align_absolute-center">
                            <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Page Size:</label>
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage1" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template>
                                </select>
                            </div>&nbsp;&nbsp;&nbsp;
                            <lightning-button label="First" icon-name="utility:chevronleft" icon-position="left" onclick={firstHandler} disabled={isFirstDisable}></lightning-button> &nbsp;&nbsp;
                            <lightning-button label="Previous" icon-name="utility:chevronleft" icon-position="left" onclick={previousHandler} disabled={isPreviousDisable}></lightning-button> &nbsp;&nbsp;
                            <span class="slds-badge slds-badge_lightest" style="margin-right: 10px;margin-left: 10px;">Showing {page} &nbsp;of&nbsp; {totalPage} &nbsp;&nbsp;Page(s)</span> &nbsp;&nbsp;
                            <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler} disabled={isNextDisable}></lightning-button> &nbsp;&nbsp;
                            <lightning-button label="Last" icon-name="utility:chevronright" icon-position="right" onclick={lastHandler} disabled={isLastDisable}></lightning-button>&nbsp;&nbsp;&nbsp;
                            <div class="slds-clearfix">
                                <div class="slds-float_right">
                                    <span class="slds-badge"> Total Records: {totalRecountCount}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Pagination Buttons End -->
                </div>
            </div>
        </div>

        <lightning-flow aura:id="flowContainer"></lightning-flow>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModalHandler}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>

                    <div class="slds-modal__header">
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate"> User Access Request Approval
                        </h1>
                    </div>

                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                        <lightning-card>
                            <div class="slds-box" style="height: auto;">
                                <lightning-combobox name="action" label="Action" value={selectedAction}
                                    placeholder="--None--" options={options}
                                    onchange={handleChange}></lightning-combobox><br />
                                <lightning-input name="comments" label="Comments" value={comments}
                                    onchange={handleCommentsChange}></lightning-input><br />



                                <footer class="slds-modal__footer">
                                    <lightning-button variant="brand" label="Submit" title="Submit"
                                        onclick={handleSubmit}></lightning-button>&nbsp;&nbsp;&nbsp;
                                    <button class="slds-button slds-button_neutral"
                                        onclick={closeModalHandler}>Close</button>
                                </footer>
                            </div>
                        </lightning-card>
                    </div>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>

<template>
    <lightning-card>
        <div class="slds-p-around_small">

            <!-- Heading -->
            <div class="slds-align_absolute-center">
                <h1 class="slds-section__title">
                    <strong>
                        <p style="color:#060406;font-size:1rem;">
                            {requestedPermissionsHeading}
                        </p>
                    </strong>
                </h1>
            </div>

            <!-- Spinner while loading -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error toast‑style banner -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <span class="slds-icon_container slds-icon-utility-error" title="Error">
                        <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                    </span>
                    <h2>{error}</h2>
                </div>
            </template>

            <!-- Datatable (only when we actually have rows) -->
            <template if:true={hasRows}>
                <div class="slds-box" style="height:auto;">
                    <lightning-datatable
                        key-field="id"
                        data={jsonData}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

            <!-- No‑permissions message -->
            <template if:true={showNoPermissions}>
                <p class="slds-text-body_regular slds-text-color_weak slds-align_absolute-center">
                    No assigned permissions found on this User Access Management record.
                </p>
            </template>

        </div>
    </lightning-card>
</template>
